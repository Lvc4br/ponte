name: Validação e pacote Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-package:
    name: Testes e empacotamento Windows
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall -q app tests main.py
      - name: Executar testes
        run: python -m pytest -v
      - name: Gerar executável
        shell: cmd
        run: build\build_windows.bat
      - name: Verificar arquivos do pacote
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PONTE/PONTE.exe")) { throw "PONTE.exe não foi gerado." }
          if (!(Test-Path "dist/PONTE/database/ponte.sql.example")) { throw "SQL de exemplo ausente." }
          Get-ChildItem "dist/PONTE" -Force | Select-Object Name, Length
      - name: Publicar pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: PONTE-Windows-Python313
          path: dist/PONTE/
          if-no-files-found: error
          retention-days: 14
