name: Validacao e executavel Windows unico

on:
  push:
    branches: [main, "feature/document-control-spreadsheet-review", "feature/three-column-engineering-dashboard", "rebuild/egt-foundation", "release/desktop-onefile"]
  pull_request:
    branches: [main, "feature/document-control-spreadsheet-review", "feature/three-column-engineering-dashboard", "rebuild/egt-foundation", "release/desktop-onefile"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-package:
    name: Testes e empacotamento Windows
    runs-on: windows-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verificar sintaxe
        run: python -m compileall -q app tests main.py
      - name: Executar testes
        run: python -m pytest -v
      - name: Gerar executavel unico
        shell: cmd
        run: build\build_windows.bat
      - name: Verificar pacote de arquivo unico
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PONTE.exe")) { throw "PONTE.exe nao foi gerado." }
          $files = Get-ChildItem "dist" -File -Recurse
          if ($files.Count -ne 1 -or $files[0].Name -ne "PONTE.exe") {
            throw "A pasta dist deve conter somente PONTE.exe."
          }
          Get-Item "dist/PONTE.exe" | Select-Object Name, Length
      - name: Publicar executavel
        uses: actions/upload-artifact@v4
        with:
          name: PONTE-Windows-OneFile
          path: dist/PONTE.exe
          if-no-files-found: error
          retention-days: 14
