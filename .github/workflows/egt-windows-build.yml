name: EGT - Windows one-file build

on:
  workflow_dispatch:
  push:
    branches:
      - ui/ponte-design-system-shell
    paths:
      - "app/**"
      - "tests/**"
      - "build/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/egt-windows-build.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app tests main.py
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Build one-file executable
        shell: cmd
        run: build\build_windows.bat
      - name: Upload EGT executable
        uses: actions/upload-artifact@v4
        with:
          name: EGT-Windows-x64
          path: dist/EGT.exe
          if-no-files-found: error
          retention-days: 14
