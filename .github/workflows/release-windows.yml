name: Build e publicação da versão Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão SemVer (ex.: 0.1.0)"
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 - build, testes e release
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Definir versão
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          } else {
            $tag = "${{ github.ref_name }}"
            $version = $tag.TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versão inválida: $version. Use MAJOR.MINOR.PATCH."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verificar sintaxe e executar testes
        run: |
          python -m compileall -q app tests main.py
          python -m pytest -v
      - name: Gerar aplicativo Windows
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name ConsultaTaxasPontes --add-data "database/ponte.sql.example;database" main.py
          if (!(Test-Path "dist/ConsultaTaxasPontes/ConsultaTaxasPontes.exe")) {
            throw "Executável não foi gerado."
          }
          New-Item -ItemType Directory -Force "dist/ConsultaTaxasPontes/database" | Out-Null
          Copy-Item "database/ponte.sql.example" "dist/ConsultaTaxasPontes/database/ponte.sql.example" -Force
          Copy-Item "README.md" "dist/ConsultaTaxasPontes/LEIA-ME.txt" -Force
          Compress-Archive -Path "dist/ConsultaTaxasPontes/*" -DestinationPath "ConsultaTaxasPontes-${{ steps.version.outputs.version }}-windows-x64.zip" -Force
      - name: Publicar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: ConsultaTaxasPontes-windows-x64
          path: ConsultaTaxasPontes-${{ steps.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Criar release e anexar executável
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: main
          name: ConsultaTaxasPontes ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ConsultaTaxasPontes-${{ steps.version.outputs.version }}-windows-x64.zip
